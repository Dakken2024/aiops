version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: aiops_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - aiops_network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: aiops_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aiops_network

  postgres_exporter:
    image: prometheus/postgres_exporter:v0.15.0
    container_name: aiops_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://aiops_user:${POSTGRES_PASSWORD}@db:5432/aiops_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    networks:
      - aiops_network

volumes:
  grafana_data:

networks:
  aiops_network:
    external: true
